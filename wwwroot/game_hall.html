<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>游戏⼤厅</title>
    <link rel="stylesheet" href="./css/common.css">
    <link rel="stylesheet" href="./css/game_hall.css">
</head>

<body>
    <div class="nav">⽹络五⼦棋对战游戏</div>
    <!-- 整个⻚⾯的容器元素 -->
    <div class="container">
        <!-- 这个 div 在 container 中是处于垂直⽔平居中这样的位置的 -->
        <div>
            <!-- 展⽰⽤⼾信息：下面是加载时的占位，真实数据由 /info 查询结果动态填充 -->
            <div id="screen">
                正在加载用户信息...
            </div>
            <!-- 匹配按钮 -->
            <div id="match-button">开始匹配</div>
        </div>
    </div>

    <script src="./js/jquery.min.js"></script>
    <script>
        var ws_url = "ws://" + location.host + "/hall";
        var ws_hdl = null;
        window.onbeforeunload = function() 
        {
            if (ws_hdl != null) {
                ws_hdl.close();
            }
        }
        // 按钮有两个状态：stop（未匹配）/ start（匹配中）
        var button_status = "stop";
        
        // 点击按钮的事件处理
        // 1. 未匹配状态：向服务器发送匹配请求
        // 2. 匹配中状态：向服务器发送取消匹配请求
        var be = document.getElementById("match-button");
        be.onclick = function () {
            if (button_status == "stop") {
                var req_json = {
                    optype: "match_start"
                };
                ws_hdl.send(JSON.stringify(req_json));
            }
            else {
                var req_json = {
                    optype: "match_stop"
                };
                ws_hdl.send(JSON.stringify(req_json));
            }
        }

        // 通过 AJAX 请求 /info 接口查询当前登录用户的信息，
        // 再把查询结果动态渲染到 #screen，而不是页面里写死的固定信息
        function get_user_info() {
            $.ajax({
                url: "/info",
                type: "GET",
                success: function (res) {
                    var info_html =
                        "<p>用户：" + res.username +
                        "　分数：" + res.score +
                        "<br/>比赛次数：" + res.total_count +
                        "　获胜场次：" + res.win_count +
                        "</p>";
                    var screen_div = document.getElementById("screen");
                    screen_div.innerHTML = info_html;

                    // 用户信息展示成功后，再建立游戏大厅的长连接
                    ws_hdl = new WebSocket(ws_url);
                    ws_hdl.onopen = ws_onopen;
                    ws_hdl.onclose = ws_onclose;
                    ws_hdl.onerror = ws_onerror;
                    ws_hdl.onmessage = ws_onmessage;
                },
                error: function (xhr) {
                    // 未登录或登录过期，跳回登录页
                    location.replace("/login.html");
                }
            });
        }
    function ws_onopen() 
    {
        console.log("连接成功");
    }

    function ws_onclose() 
    {
        console.log("连接关闭");
    }

    function ws_onerror() 
    {
        console.log("连接错误");
    }

    function ws_onmessage(evt) 
    {
        // 1. 取出服务器下发的数据并解析
        var resp = JSON.parse(evt.data);
        // 2. 先判断请求是否失败（服务端可能返回布尔 false，也可能是字符串 "false"）
        if (resp.result == false || resp.result == "false") {
            console.log("连接失败：" + resp.reason);
            location.replace("/login.html");
            return;
        }
        // 3. 根据业务字段做相应处理
        var optype = resp["optype"];
        if (optype == "hall_ready") {
            // 游戏大厅长连接建立成功，可以开始匹配
            console.log("大厅连接就绪");
            return;
        } else if (optype == "match_success") {
            alert("匹配成功，正在进入游戏房间...");
            location.replace("/game_room.html");
        } else if (optype == "match_start") {
            console.log("已发起匹配");
            button_status = "start";
            be.innerHTML = "匹配中...点击取消匹配";
            return;
        } else if (optype == "match_stop") {
            console.log("玩家已取消匹配");
            button_status = "stop";
            be.innerHTML = "开始匹配";
            return;
        }
    }
    get_user_info();
    </script>
</body>

</html>
